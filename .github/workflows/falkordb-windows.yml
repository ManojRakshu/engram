# Builds FalkorDB + Redis as native Windows binaries (Cygwin runtime), so Engram can run
# the same embedded setup on Windows that FalkorDBLite gives it on macOS and Linux.
name: falkordb-windows

on:
  push:
    branches: [windows]
    paths: [.github/workflows/falkordb-windows.yml, scripts/windows/patch-falkordb.sh]
  workflow_dispatch:

# One build at a time; a newer push replaces a build still running.
concurrency:
  group: falkordb-windows-build
  cancel-in-progress: true

permissions:
  actions: read # the e2e stage downloads this run's build
  contents: read

env:
  FALKORDB_TAG: v4.18.3
  REDIS_VERSION: 8.6.2
  PEG_VERSION: 0.1.20

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh

      - uses: actions/checkout@v4

      - name: Clone FalkorDB
        shell: pwsh
        run: git clone --depth 1 --branch $env:FALKORDB_TAG --recurse-submodules --shallow-submodules https://github.com/FalkorDB/FalkorDB.git fdb

      - uses: cygwin/cygwin-install-action@v4
        with:
          add-to-path: false # our Cygwin steps set their own PATH; keeps Cygwin's git away from actions/checkout
          packages: >-
            gcc-core gcc-g++ make cmake autoconf automake libtool pkg-config m4
            libssl-devel zlib-devel python3 git zip patch wget curl

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: fdb/bin
          key: fdb-bin-v2-${{ env.FALKORDB_TAG }}-${{ github.run_id }}
          restore-keys: fdb-bin-v2-${{ env.FALKORDB_TAG }}-

      - name: Rust part (x86_64-pc-cygwin, nightly + build-std)
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/fdb/bin/linux-x64-release/FalkorDB-core-rs"
          if (Test-Path "$out/release/libFalkorDB_rs.a") { "cached"; exit 0 }
          rustup toolchain install nightly --profile minimal --component rust-src
          cd fdb/deps/FalkorDB-core-rs
          cargo +nightly update -p libc
          $env:RUSTFLAGS = "--print native-static-libs"
          cargo +nightly build "-Zbuild-std=std,panic_abort" --target x86_64-pc-cygwin --release --features falkordb_allocator --target-dir "$out/cyg"
          New-Item -ItemType Directory -Force "$out/release" | Out-Null
          Copy-Item "$out/cyg/x86_64-pc-cygwin/release/libFalkorDB_rs.a" "$out/release/"

      - name: peg/leg (parser generator for libcypher-parser)
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          # Only libcypher-parser needs it; skip when that is already in the build cache.
          [ -f fdb/bin/linux-x64-release/libcypher-parser/lib/src/.libs/libcypher-parser.a ] && { echo "cached"; exit 0; }
          cd /tmp
          curl -fsSL --retry 4 --connect-timeout 20 https://www.piumarta.com/software/peg/peg-$PEG_VERSION.tar.gz -o peg.tgz \
            || curl -fsSL --retry 4 https://github.com/gpakosz/peg/archive/refs/heads/master.tar.gz -o peg.tgz # mirror
          mkdir peg && tar xzf peg.tgz -C peg --strip-components=1
          cd peg && make && make install PREFIX=/usr/local
          which leg

      - name: Build FalkorDB module
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          # Cygwin ships CMake 4, which rejects cmake_minimum_required(< 3.5) in older deps (cpu_features).
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          cd fdb
          bash ../scripts/windows/patch-falkordb.sh
          # A dependency that failed last time left a configured build dir behind (cached): start it clean.
          d=bin/linux-x64-release
          [ -f $d/libcypher-parser/lib/src/.libs/libcypher-parser.a ] || rm -rf $d/libcypher-parser
          [ -f $d/GraphBLAS/libgraphblas.a ] || rm -rf $d/GraphBLAS
          [ -f $d/LAGraph/src/liblagraph.a ] || rm -rf $d/LAGraph
          [ -f $d/oniguruma/libonig.a ] || rm -rf $d/oniguruma
          ./build.sh GCC=1 JIT=0 VERBOSE=1
          ls -la bin/linux-x64-release/falkordb.so

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fdb/bin
          key: fdb-bin-v2-${{ env.FALKORDB_TAG }}-${{ github.run_id }}

      - name: Redis build cache
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: redis-${{ env.REDIS_VERSION }}/src/*.exe
          key: redis-cygwin-v2-${{ env.REDIS_VERSION }}-usable-size

      - name: Build Redis
        if: steps.redis-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          sed -i 's/__GNU_VISIBLE/1/' /usr/include/dlfcn.h
          curl -fsSL https://github.com/redis/redis/archive/refs/tags/$REDIS_VERSION.tar.gz | tar xz
          cd redis-$REDIS_VERSION
          sed -i 's/all: \(.*\) module_tests$/all: \1/' src/Makefile
          # USE_MALLOC_USABLE_SIZE: like glibc builds, no 8-byte size prefix on each block, so modules get
          # 16-byte-aligned memory (SSE code in RediSearch faults on 8-byte-aligned blocks). _GNU_SOURCE from
          # the start, as on Linux, so the late define in zmalloc.h doesn't hide mkostemp & co.
          make CFLAGS="-Wno-char-subscripts -O0 -D_GNU_SOURCE -DUSE_MALLOC_USABLE_SIZE" -j$(nproc)

      - name: Package
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          d=falkordb-windows-x64
          mkdir -p $d
          cp redis-$REDIS_VERSION/src/redis-server.exe redis-$REDIS_VERSION/src/redis-cli.exe $d/
          cp fdb/bin/linux-x64-release/falkordb.so $d/
          strip --strip-debug $d/falkordb.so # debug info only; the symbol table stays
          objdump -p $d/falkordb.so | grep -E "^Magic|SizeOfImage|DLL Name" || true
          # Does it load at all (Cygwin on PATH)? Separates a bad DLL from a missing dependency.
          ($d/redis-server.exe --port 6391 --save "" --loadmodule "$(pwd)/$d/falkordb.so" > cyg-load.log 2>&1 &)
          sleep 5; $d/redis-cli.exe -p 6391 MODULE LIST || true; $d/redis-cli.exe -p 6391 SHUTDOWN NOSAVE || true
          cat cyg-load.log | tail -5
          for f in $d/*.exe $d/falkordb.so; do cygcheck "$(cygpath -w "$f")"; done \
            | tr -d '\r' | sed 's/^ *//' | grep -i '\\cygwin\\bin\\' | sort -u | while read -r w; do cp "$(cygpath -u "$w")" $d/; done
          ls -la $d
          zip -q -r $d.zip $d
          sha256sum $d.zip | tee $d.zip.sha256

      - name: Smoke test (plain Windows, no Cygwin on PATH)
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $d = "$env:GITHUB_WORKSPACE\falkordb-windows-x64"
          & "$d\redis-server.exe" --version
          $p = Start-Process -PassThru -NoNewWindow -FilePath "$d\redis-server.exe" -ArgumentList "--port 6390 --bind 127.0.0.1 --save """" --dir $env:RUNNER_TEMP --loadmodule falkordb.so" -WorkingDirectory $d
          Start-Sleep -Seconds 4
          $cli = "$d\redis-cli.exe"
          & $cli -p 6390 MODULE LIST
          & $cli -p 6390 GRAPH.QUERY g "CREATE (:File {path:'a.py'})-[:DEFINES]->(:Symbol {name:'f'})-[:CALLS]->(:Symbol {name:'g'})"
          $r = & $cli -p 6390 GRAPH.QUERY g "MATCH (:File)-[:DEFINES]->(s)-[:CALLS*1..2]->(t) RETURN s.name, t.name"
          $r
          if (-not ($r -match 'g')) { throw "graph query failed" }
          & $cli -p 6390 GRAPH.QUERY g "CALL db.idx.fulltext.createNodeIndex('Symbol', 'name')"
          & $cli -p 6390 GRAPH.QUERY g "CALL db.idx.fulltext.queryNodes('Symbol', 'f') YIELD node RETURN node.name"
          & $cli -p 6390 GRAPH.QUERY g "CALL algo.pageRank('Symbol', 'CALLS') YIELD node, score RETURN node.name, score"
          & $cli -p 6390 BGSAVE
          Start-Sleep -Seconds 4
          & $cli -p 6390 LASTSAVE
          & $cli -p 6390 SHUTDOWN SAVE
          Start-Sleep -Seconds 2
          $p2 = Start-Process -PassThru -NoNewWindow -FilePath "$d\redis-server.exe" -ArgumentList "--port 6390 --bind 127.0.0.1 --dir $env:RUNNER_TEMP --loadmodule falkordb.so" -WorkingDirectory $d
          Start-Sleep -Seconds 4
          $r2 = & $cli -p 6390 GRAPH.QUERY g "MATCH (s)-[:CALLS]->(t) RETURN count(*)"
          $r2
          if (-not ($r2 -match '^1$')) { throw "graph not restored from RDB" }
          & $cli -p 6390 SHUTDOWN NOSAVE

      - uses: actions/upload-artifact@v4 # only after the smoke test passed
        with:
          name: falkordb-windows-x64
          path: |
            falkordb-windows-x64.zip
            falkordb-windows-x64.zip.sha256

  e2e:
    needs: build
    uses: ./.github/workflows/engram-windows-e2e.yml
    with:
      falkordb_run: ${{ github.run_id }}
