# Pushing a falkordb-linux-v* tag publishes the zips the latest green falkordb-linux run built and tested,
# byte for byte. Their checksums must match the ones pinned in src/embedded.ts at the tag.
name: falkordb-linux-release

on:
  push:
    tags: ["falkordb-linux-v*"]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Latest green falkordb-linux run
        id: run
        run: echo "id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow falkordb-linux.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: falkordb-linux-*
          path: art
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Checksums match src/embedded.ts
        run: |
          for a in x64 arm64; do
            z=art/falkordb-linux-$a/falkordb-linux-$a.zip
            sum=$(sha256sum "$z" | cut -d' ' -f1)
            echo "$a $sum"
            grep -q "linux(\"$a\", \"$sum\"" src/embedded.ts
          done
      - name: Release
        run: |
          gh release create "$TAG" --verify-tag \
            --title "FalkorDB 4.18.3 for older Linux ($TAG)" \
            --notes "FalkorDB v4.18.3 for Linux older than FalkorDBLite supports: x64 with glibc 2.28+, arm64 with glibc 2.35+. The module is FalkorDB's own release binary, unmodified; Redis 8.6.2 and OpenSSL 3.5 are built on glibc 2.28. Built and tested in run ${{ steps.run.outputs.id }} ([workflow](.github/workflows/falkordb-linux.yml)). Engram downloads it automatically and checks its sha256." \
            art/falkordb-linux-x64/falkordb-linux-x64.zip art/falkordb-linux-x64/falkordb-linux-x64.zip.sha256 \
            art/falkordb-linux-arm64/falkordb-linux-arm64.zip art/falkordb-linux-arm64/falkordb-linux-arm64.zip.sha256
