# Which hook forms does Claude Code run on native Windows, and what paths does it pass them?
name: claude-code-windows-probe

on:
  push:
    branches: [windows]
    paths: [.github/workflows/claude-code-windows-probe.yml, scripts/windows/probe-plugin/**, scripts/windows/mock-anthropic.mjs]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code (native)
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install probe plugin
        run: |
          $bin = "scripts/windows/probe-plugin/plugin/bin"
          Copy-Item (Get-Command node).Source "$bin/probe.exe"
          claude --version
          claude plugin marketplace add "$env:GITHUB_WORKSPACE\scripts\windows\probe-plugin"
          claude plugin install probe@probe
          claude plugin list
      - name: Run Claude Code against a scripted API
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8787
          ANTHROPIC_API_KEY: sk-ant-mock
          PROBE_OUT: ${{ runner.temp }}\probe-out
        run: |
          $repo = "$env:RUNNER_TEMP\demo repo"
          New-Item -ItemType Directory -Force $repo | Out-Null
          Set-Content "$repo\notes.txt" "probe"
          git -C $repo init -q; git -C $repo add .; git -C $repo -c user.email=a@b -c user.name=a commit -qm init
          $mock = Start-Process -PassThru -NoNewWindow node -ArgumentList "scripts/windows/mock-anthropic.mjs", "`"$repo\notes.txt`"" -RedirectStandardOutput "$env:RUNNER_TEMP\mock.log"
          Start-Sleep 2
          Push-Location $repo
          claude -p "edit notes" --dangerously-skip-permissions --output-format json --debug 2>&1 | Out-File "$env:RUNNER_TEMP\claude.log"
          Pop-Location
          Get-Content "$env:RUNNER_TEMP\mock.log"
          "---- notes.txt"; Get-Content "$repo\notes.txt"
          "---- hook outputs"
          Get-ChildItem $env:PROBE_OUT | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
          "---- claude log (hook lines)"
          Select-String -Path "$env:RUNNER_TEMP\claude.log" -Pattern "hook|Hook|ENOENT|spawn" | Select-Object -First 80 | ForEach-Object { $_.Line }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: |
            ${{ runner.temp }}/probe-out
            ${{ runner.temp }}/claude.log
            ${{ runner.temp }}/mock.log
