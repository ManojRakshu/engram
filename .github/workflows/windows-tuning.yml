# Where does a map's time go on Windows compared with Linux? Same repos, same maps, the newest Windows
# build that passed the smoke test; per query, the round trip next to FalkorDB's own execution time.
name: windows-tuning

on:
  push:
    branches: [windows]
    paths: [.github/workflows/windows-tuning.yml]

concurrency:
  group: windows-tuning
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Newest FalkorDB build that passed the smoke test
        if: runner.os == 'Windows'
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=falkordb-windows-x64&per_page=1" -q '.artifacts[0].workflow_run.id')
          echo "build from run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n falkordb-windows-x64 -D "$RUNNER_TEMP/fdb"
          echo "ENGRAM_FALKORDB_ZIP=$RUNNER_TEMP\\fdb\\falkordb-windows-x64.zip" >> "$GITHUB_ENV"
      - name: Benchmark repos
        run: |
          git clone -q https://github.com/pallets/click.git t/click && git -C t/click checkout -q 2247b35ea1c47c727d7a06e51fa280e12a863ff6
          git clone -q https://github.com/networkx/networkx.git t/networkx && git -C t/networkx checkout -q 6da4704cbf32ba6f50f6d9c46cc0a071e3a87985
      - run: npx tsx src/cli.ts db start
      - name: Profile
        run: |
          npx tsx scripts/e2e/snapshot.ts out click=t/click=bench/tasks.click.json networkx=t/networkx=bench/tasks.networkx.json > /dev/null
          node -e '
            const t = require("./out/timings.json");
            for (const [r, x] of Object.entries(t)) {
              console.log(`${process.env.RUNNER_OS} ${r}: map median ${x.packMedianMs} ms, all maps ${x.packTotalMs} ms`);
              for (const [q, s] of Object.entries(x.queries).sort((a, b) => b[1].total - a[1].total).slice(0, 10))
                console.log(`  ${q.padEnd(18)} round trip ${String(Math.round(s.total)).padStart(5)} ms   FalkorDB ${String(Math.round(s.server ?? 0)).padStart(5)} ms   (${s.n} calls)`);
            }' | tee -a "$GITHUB_STEP_SUMMARY"
