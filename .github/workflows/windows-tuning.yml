# Which FalkorDB thread settings make maps fastest on Windows? Same build, same repos, same maps; only the
# module arguments change. Every variant must produce the same snapshot.
name: windows-tuning

on:
  push:
    branches: [windows]
    paths: [.github/workflows/windows-tuning.yml]

concurrency:
  group: windows-tuning
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  tune:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Newest FalkorDB build that passed the smoke test
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=falkordb-windows-x64&per_page=1" -q '.artifacts[0].workflow_run.id')
          echo "build from run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n falkordb-windows-x64 -D "$RUNNER_TEMP/fdb"
          cd "$RUNNER_TEMP/fdb" && unzip -q falkordb-windows-x64.zip
      - name: Benchmark repos
        run: |
          git clone -q https://github.com/pallets/click.git t/click && git -C t/click checkout -q 2247b35ea1c47c727d7a06e51fa280e12a863ff6
          git clone -q https://github.com/networkx/networkx.git t/networkx && git -C t/networkx checkout -q 6da4704cbf32ba6f50f6d9c46cc0a071e3a87985
      - name: Variants
        run: |
          nproc
          d="$RUNNER_TEMP/fdb/falkordb-windows-x64"
          run() {
            name=$1; shift
            (cd "$d" && ./redis-server.exe --port 6390 --bind 127.0.0.1 --save "" --loadmodule falkordb.so "$@" > "$RUNNER_TEMP/$name.log" 2>&1 &)
            sleep 4
            "$d/redis-cli.exe" -p 6390 GRAPH.CONFIG GET THREAD_COUNT | tr '\n' ' '; "$d/redis-cli.exe" -p 6390 GRAPH.CONFIG GET OMP_THREAD_COUNT | tr '\n' ' '; echo
            FALKORDB_URL=falkor://127.0.0.1:6390 npx tsx scripts/e2e/snapshot.ts "out/$name" click=t/click=bench/tasks.click.json networkx=t/networkx=bench/tasks.networkx.json > /dev/null
            "$d/redis-cli.exe" -p 6390 SHUTDOWN NOSAVE > /dev/null 2>&1; sleep 2
            node -e '
              const t = require("./out/'"$name"'/timings.json");
              for (const [r, x] of Object.entries(t)) {
                const top = Object.entries(x.queries).sort((a, b) => b[1].total - a[1].total).slice(0, 4).map(([q, s]) => q + " " + Math.round(s.total)).join(", ");
                console.log("'"$name"'", r, "index", x.indexMs, "map median", x.packMedianMs, "max", x.packMaxMs, "|", top);
              }' | tee -a "$GITHUB_STEP_SUMMARY"
          }
          run default
          run omp1 OMP_THREAD_COUNT 1
          run threads1 THREAD_COUNT 1
          run both1 THREAD_COUNT 1 OMP_THREAD_COUNT 1
          run threads2-omp1 THREAD_COUNT 2 OMP_THREAD_COUNT 1
          for v in omp1 threads1 both1 threads2-omp1; do cmp -s out/default/snapshot.json out/$v/snapshot.json && echo "$v: same snapshot" || { echo "$v: SNAPSHOT DIFFERS"; exit 1; }; done
